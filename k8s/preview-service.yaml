# ── Preview Service (ephemeral) ──
# Created during smoke test to expose inactive track inside cluster.
# Deleted after test completes.
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}-preview
  namespace: ${NAMESPACE}
  labels:
    app: ${APP_NAME}
    purpose: smoke-test
spec:
  type: ClusterIP
  selector:
    app: ${APP_NAME}
    version: ${INACTIVE_VERSION}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
