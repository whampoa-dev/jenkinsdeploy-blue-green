# ── Preview Service (ephemeral — created/deleted each pipeline run) ──
# Exposes the inactive track for smoke testing before switch.
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}-preview
  namespace: ${NAMESPACE}
  labels:
    app: ${APP_NAME}
    purpose: smoke-test
spec:
  type: ClusterIP
  selector:
    app: ${APP_NAME}
    version: ${INACTIVE_VERSION}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
