# ── Live Service ──
# Traffic is switched by patching spec.selector.version between "blue" / "green".
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}-svc
  namespace: ${NAMESPACE}
  labels:
    app: ${APP_NAME}
spec:
  type: ClusterIP
  selector:
    app: ${APP_NAME}
    version: blue   # ← patched to "green" during switch
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
